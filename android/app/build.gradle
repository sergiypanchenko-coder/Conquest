plugins { id 'com.android.application' }
android {
    namespace 'com.conquestgame.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.conquestgame.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            // the key lives outside the repository; pass its location and passwords in the environment
            storeFile file(System.getenv('CQ_KEYSTORE') ?: 'missing.jks')
            storePassword System.getenv('CQ_KEYSTORE_PASS')
            keyAlias 'conquest'
            keyPassword System.getenv('CQ_KEYSTORE_PASS')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
