function drawLeaf(g,x,y,s,rot,glowA){if(LEAFIMG.complete&&LEAFIMG.naturalWidth){g.save();if(glowA){const gr=g.createRadialGradient(x,y-10*s,2,x,y-10*s,40*s);gr.addColorStop(0,'rgba(140,255,110,'+glowA+')');gr.addColorStop(1,'rgba(120,255,80,0)');g.fillStyle=gr;g.fillRect(x-44*s,y-54*s,88*s,88*s);}
  g.translate(x,y-8*s);g.rotate(rot||0);const h=62*s,w=h*LEAFIMG.naturalWidth/LEAFIMG.naturalHeight;g.drawImage(LEAFIMG,-w/2,-h/2,w,h);g.restore();return;}
  g.save();if(glowA){const gr=g.createRadialGradient(x,y-10*s,2,x,y-10*s,40*s);gr.addColorStop(0,'rgba(140,255,110,'+glowA+')');gr.addColorStop(1,'rgba(120,255,80,0)');g.fillStyle=gr;g.fillRect(x-44*s,y-54*s,88*s,88*s);}
  g.translate(x,y);g.rotate(rot||0);g.scale(s,s);g.lineJoin='round';g.lineCap='round';
  const lf=[[0,35,1.15],[-.98,30,1.2],[.98,30,1.2],[-1.95,19,1.25],[1.95,19,1.25]];
  const path=()=>{g.beginPath();lf.forEach(([a,L,wd])=>{const c=Math.cos(a),sn=Math.sin(a),P=(px,py)=>[px*wd*L*c-py*L*sn,px*wd*L*sn+py*L*c];
    g.moveTo(0,0);LEAFP.forEach(([px,py])=>{const q=P(px,py);g.lineTo(q[0],q[1]);});for(let i=LEAFP.length-2;i>=0;i--){const q=P(-LEAFP[i][0],LEAFP[i][1]);g.lineTo(q[0],q[1]);}g.closePath();});};
  const stem=()=>{g.beginPath();g.moveTo(0,-2);g.quadraticCurveTo(.5,12,-5,21);};
  stem();g.strokeStyle='#111';g.lineWidth=8.5;g.stroke();
  path();g.strokeStyle='#111';g.lineWidth=3.4;g.stroke();
  stem();g.strokeStyle='#3cb54a';g.lineWidth=4.6;g.stroke();
  path();g.fillStyle='#3cb54a';g.fill();g.beginPath();g.arc(0,-1,4.6,0,PI*2);g.fill();
  g.restore();}

  if(c===CODE){window.alert('That is already the code of this device.');return;}
  rpc('conquest_restore',{p_code:c}).then(d=>{if(!d){window.alert('No backup was found for '+c+'. Check the code and your connection.');return;}
    applyRemote(d,true);CODE=c;try{localStorage.setItem('conquest_code',CODE);}catch(e){}
    doBackup().then(()=>{const n=Object.keys(BEST).length;G.floats.push({x:W/2,y:H/2,s:'Progress restored',t:2});window.alert('Welcome back'+(ME.name?', '+ME.name:'')+'! '+n+(n===1?' battle':' battles')+' won, '+Math.max(0,unlocked-1)+' unlocked. This device now uses your code.');menuSel=null;loadOnline();});});}
function ago(t){if(!t)return'not yet';const s=Math.round((Date.now()-t)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' days ago';}
function drawBackup0(){dimAll('rgba(110,45,10,.45)');panel(230,80,500,450,'Cloud backup');
  const st=BK.state==='saving'?'Backing up…':BK.state==='off'?'Offline: will back up when you are connected':'Backed up '+ago(BK.at)+' ✓';
  etxt(st,480,154,16,BF,'center',BK.state==='off'?'#a8220e':'#2e6a2a');
  etxt('Your progress is saved online automatically after every battle.',480,186,14,BF,'center','#6a2a0a');
  etxt('Your commander code',480,226,15,BF,'center','#9a3e12');
  ctx.fillStyle='rgba(255,246,224,.85)';rpath(480-170,240,340,56,8);ctx.fill();ctx.strokeStyle='#7a3410';ctx.lineWidth=1.5;rpath(480-170,240,340,56,8);ctx.stroke();
  etxt(CODE,480,269,30,TF,'center','#4a1a06');
  etxt('Keep it somewhere safe. Enter it on another phone, computer',480,322,14,BF,'center','#6a2a0a');
  etxt('or browser to continue with all your battles and scores.',480,342,14,BF,'center','#6a2a0a');
  btn(262,372,210,46,'Copy code',()=>{const done=()=>G.floats.push({x:367,y:432,s:'Copied',t:1});try{navigator.clipboard.writeText(CODE).then(done,()=>window.prompt('Copy your code:',CODE));}catch(e){window.prompt('Copy your code:',CODE);}},{size:16});
  btn(488,372,210,46,'Use another code',restoreCode,{size:16});
  btn(375,440,210,46,'Close',()=>{G.bk=false;},{size:16});}
function drawBackup(...a){centered(()=>drawBackup0(...a));}
let FIN_T=-1;

/* pre-draw every animation frame the coming battle needs, a few per frame, during the countdown */
const WARM=[];let WARMC=null;
function queueWarm(){WARM.length=0;const TAU2=PI*2,iP=TAU2/2.2;
  (G.squad||[]).forEach(k=>{if(k==='raft')return;const ty=k==='quarter'?'financier':k;for(let b=0;b<4;b++)WARM.push([ty,{flip:0},(b+.5)/4*iP]);for(let a=1;a<=5;a++)WARM.push([ty,{flip:0,a:a/5},0]);});
  (G.L.foes||[]).forEach(ty=>{const F=FOE[ty];if(!F||F.boss)return;const P=PER_WALK[ty]||(F.cav?TAU2/13:TAU2/9);for(let b=0;b<8;b++)WARM.push([ty,{flip:1,walk:true},(b+.5)/8*P]);for(let a=1;a<=5;a++)WARM.push([ty,{flip:1,a:a/5},0]);});}
function stepWarm(n){if(!WARM.length)return;if(!WARMC){WARMC=document.createElement('canvas').getContext('2d');WARMC.canvas.width=WARMC.canvas.height=2;}const prev=ctx;ctxSwap(WARMC);try{while(n-->0&&WARM.length){const[ty,o,t]=WARM.pop();drawUnit(ty,0,0,t,o);}}catch(e){}finally{ctxSwap(prev);}}
function updatePrep(dt){G.pt+=dt;if(G.phase==='count'){if(!G.warmed){G.warmed=1;queueWarm();}stepWarm(6);}if(G.L.final&&G.phase==='scout'&&FIN_T>=0&&FIN_T<9){FIN_T+=dt;G.pt=0;}if(G.phase==='scout'&&G.pt>2.2){G.phase='pick';G.pt=0;}
  if(G.phase==='count'&&G.pt>2.6){G.state='play';G.banner=null;G.cd={};ORDER.forEach(k=>G.cd[k]=0);Object.assign(G.cd,START_CD);}}

/* ---------- menu ---------- */
let last=performance.now();
const PERF={n:0,sum:0,cool:0};
function perfTick(r){if(r<=0||r>0.5||GFX!=='auto')return;PERF.n++;PERF.sum+=r;PERF.cool-=r;if(PERF.sum<1.5||PERF.n<8)return;const avg=PERF.sum/PERF.n;PERF.n=0;PERF.sum=0;if(PERF.cool>0)return;
  if(avg>1/42&&QUAL>.5){QUAL=Math.max(.5,QUAL*.82);PERF.cool=1.4;resize();}else if(avg<1/57&&QUAL<1){QUAL=Math.min(1,QUAL*1.12);PERF.cool=4;resize();}}
/* self-update: installed home-screen apps are often resumed, not restarted, so check for new versions ourselves */
const BUILD='20261123-160437';
const UPD={ready:false,going:false,want:''};try{if(location.search.includes('v=')&&history.replaceState)history.replaceState(null,'','/play'+(location.search.includes('source=app')?'?source=app':''));}catch(e){}
function checkUpdate(){if(BUILD==='dev')return;try{fetch('/version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v&&v.build&&v.build!==BUILD){let tried='';try{tried=sessionStorage.getItem('cq_upd')||'';}catch(e){}if(tried===v.build)return;UPD.want=v.build;UPD.ready=true;}}).catch(()=>{});}catch(e){}}
function applyUpdate(){if(UPD.going)return;UPD.going=true;
  /* never wait on anything: reload within 1.5 s no matter what, to a fresh URL so no cache can hand back the old page */
  let gone=false;const go=()=>{if(gone)return;gone=true;try{sessionStorage.setItem('cq_upd',UPD.want||'');}catch(e){}location.replace('/play?source=app&v='+encodeURIComponent(UPD.want||Date.now()));};
  try{doBackup(true);}catch(e){}setTimeout(go,1500);
  try{navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}).then(()=>setTimeout(go,300));}catch(e){}}
setTimeout(checkUpdate,2500);setInterval(checkUpdate,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
addEventListener('pageshow',e=>{if(e.persisted)checkUpdate();});
function updateFrame(){if(!UPD.ready)return;
  if(G.state==='menu'&&!G.hall&&!G.bk){applyUpdate();ctx.fillStyle='rgba(60,25,6,.55)';ctx.fillRect(0,0,W,H);otxt('Updating Conquest…',W/2,H/2,28,'#fff2d8','rgba(60,20,4,.9)',4,TF);return;}
  if(G.state==='play'||G.state==='prep'){otxt('Update ready · applies after this battle',W-14,H-34,12,'#fff2d8','rgba(60,20,4,.85)',3,BF,'right');}}
function frame(now){try{musicFrame();}catch(e){}const rawDt=(now-last)/1000;let dt=Math.max(0,Math.min(0.05,rawDt));last=now;perfTick(rawDt);G.t=(G.t||0)+dt;G.btns=[];
  ctx.clearRect(0,0,W,H);
  if(G.state==='cut'){drawCut(dt);}
  else if(G.state==='menu'){if((G.t||0)-ONLINE.loadedAt>30||G.justBack){G.justBack=0;loadOnline();}drawMenu();atmos(.8);if(G.hall){G.btns=[];drawHall();}else if(G.bk){G.btns=[];drawBackup();}else if(G.army){G.btns=[];drawArmy();}else if(G.films){G.btns=[];drawFilms();}}
  else if(G.state==='prep'){updatePrep(dt);drawPrep();if(G.L.name==='Didgori')fogLayer();atmos(fieldAtmos(G.L,.7));if(G.L.final&&FIN_T>=0&&FIN_T<9)finaleCard();if(G.phase==='scout')G.btns=[{x:0,y:0,w:W,h:H,fn:()=>{if(G.L.final&&FIN_T>=0&&FIN_T<9){FIN_T=9;return;}G.phase='pick';G.pt=0;}}];}
  else{if(G.state==='play')stepWarm(2);if(G.state==='play'&&!G.paused){for(let i=0;i<G.speed;i++)update(dt);}
    drawGame();if(!(G.L&&G.L.night))atmos(fieldAtmos(G.L,.55));G.btns=G.state==='play'&&!G.paused?G.btns:[];
    if(G.paused){overlay('Paused','The enemy waits for no one.','Resume',()=>{G.paused=false;});ibtn(W-32,128,'sound',SOUND?'Sound':'Muted',toggleSound,{off:!SOUND});ibtn(W-32,196,'music',MUSIC?'Music':'No music',toggleMusic,{off:!MUSIC});ibtn(W-32,264,'gfx',gfxLabel().replace(/^Graphics:\s*/,''),toggleGfx);}
    if(G.state==='win'&&G.L.final){drawFinale();}
    else if(G.state==='win')overlay('Victory!  +'+(G.score||0)+' points',G.li<LEVELS.length-1?(G.newR&&G.newR.length?'New recruits: '+G.newR.join(' and ')+'!':'The line holds. A new front opens.'):'Every era defended. You are a legend.',G.li<LEVELS.length-1?'Next battle':'Play again',()=>{const n=G.li<LEVELS.length-1?G.li+1:0;menuChap=LEVELS[n].ch;start(n);});
    if(G.state==='lose')overlay('The wall has fallen','Regroup and try a different formation.','Retry',()=>start(G.li));}
  try{updateFrame();}catch(e){}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

cv.addEventListener('pointerdown',ev=>{ev.preventDefault();if(SOUND){auInit();if(AU.c&&AU.c.state==='suspended')AU.c.resume();}const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  for(let i=G.btns.length-1;i>=0;i--){const b=G.btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h+4){b.fn();return;}}
  if(G.state!=='play'||G.paused)return;
  for(let i=G.coins.length-1;i>=0;i--){const c=G.coins[i];if(Math.hypot(c.x-x,c.y-y)<30){collect(c);return;}}
  for(const l of G.leafDrops)if(l.fly==null&&Math.hypot(l.x-x,l.y-y)<38){grabLeaf(l);return;}
  const c=Math.floor((x-LEFT)/CW),rw=Math.floor((y-TOP)/CH);if(c<0||c>=COLS||rw<0||rw>=ROWS)return;
  if(G.pwSel==='volley'){usePower('volley',x,y);return;}
  if(G.leafSel){const d=G.grid[rw][c];G.leafSel=false;if(d&&d.type!=='raft'&&G.leaves>0)rally(d);return;}
  if(G.shovel){const d=G.grid[rw][c];if(d&&!isRelic(d)){removeDef(d);puff(d.x,d.y-20,'#c9b48a',8,60);}G.shovel=false;return;}
  if(G.sel){const D=DEFS[G.sel],wet=seaAt(rw,c),ex=G.grid[rw][c];let ok;
    ok=!wet&&!ex;
    if(isWell(rw,c)){G.floats.push({x,y:y-20,s:'A well stands here',t:.9});return;}
    if(!ok){G.floats.push({x,y:y-20,s:wet?'Soldiers need solid ground':'Occupied',t:.9});return;}
    if(G.gold>=D.cost&&G.cd[G.sel]<=0)place(G.sel,rw,c);G.sel=null;}
},{passive:false});
}
